{% extends 'notes/base.html' %}
{% block title %}{{ tag.name }} | Get-it{% endblock %}
{% block content %}
<div class="container page-container">
  <section class="notes-section" aria-labelledby="tag-heading">
    <div class="tag-heading">
      <a class="back-link" href="{% url 'tag_list' %}">Voltar às tags</a>
      <h1 id="tag-heading" class="page-title">Tag: {{ tag.name }}</h1>
      <h2 class="section-heading">Anotações com esta tag</h2>
    </div>
    <div class="card-container">
      {% for note in notes %}
        {% include 'notes/card.html' %}
      {% empty %}
        <p class="empty-state">Nenhuma anotação com esta tag.</p>
      {% endfor %}
    </div>
  </section>
</div>
{% endblock %}
