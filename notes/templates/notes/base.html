{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Get-it | Anotações{% endblock %}</title>
  <link rel="icon" href="{% static 'notes/img/logo-getit.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'notes/getit.css' %}">
  <script src="{% static 'notes/getit.js' %}" defer></script>
</head>
<body>
  <header class="appbar">
    <a href="{% url 'index' %}" aria-label="Get-it — página inicial">
      <img class="logo" src="{% static 'notes/img/logo-getit.png' %}" alt="Get-it">
    </a>
    <span class="subtitle">Como o Post-it, mas com outro verbo</span>
    <nav class="app-nav" aria-label="Navegação principal">
      <a href="{% url 'index' %}">Anotações</a>
      <a href="{% url 'tag_list' %}">Tags</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
