name: tecweb-projeto1b

services:
  postgres:
    image: postgres:18-alpine
    container_name: tecweb1b-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: getit
      POSTGRES_USER: getituser
      POSTGRES_PASSWORD: getitsenha
    ports:
      - "5435:5432"
    volumes:
      - tecweb1b_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getituser -d getit"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.50

volumes:
  tecweb1b_postgres_data:
    name: tecweb1b-postgres-data
